[project]
name = "wildlife-scanner"
version = "0.0.1"
description = "Species-agnostic fusion of wildlife observations and environmental signals into where/when encounter predictions."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "astronomy-engine>=2.1",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "h3>=4.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# LLM extraction for profile generation (docs/design/framework.md §4.3).
llm = ["anthropic>=2.8"]
deploy = [
    "boto3>=1.35",
]

[project.scripts]
wildlife-scanner = "wildlife_scanner.cli:main"

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildlife_scanner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

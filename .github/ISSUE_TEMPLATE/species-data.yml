name: Species name, status or place
description: A wrong or missing name, conservation status, photo or place.
title: "Data: "
labels: ["data quality"]
body:
  - type: markdown
    attributes:
      value: |
        **If a species should be better protected (for example it's threatened locally), please
        report it privately** (see SECURITY.md), so its locations aren't drawn attention to here.
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong
      options:
        - Common or scientific name
        - Conservation status (should be less protected)
        - Photo (wrong species, or the credit is wrong)
        - A place is missing or wrongly placed
        - Something else
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: Species or place
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details and source
      description: What it should be, and a source (a checklist, a status list, a field guide).
    validations:
      required: true

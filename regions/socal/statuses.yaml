# Curated, supplementary conservation statuses for the socal region pack.
#
# This file can only RAISE protection: it is merged with automatic status lookups and never
# counts as a complete lookup by itself (fail closed). Entries name the population a status
# applies to when it is narrower than the species; species-level tiers take the highest tier of
# any listed population present in the region.
#
# Verify each entry against USFWS ECOS / CDFW lists before relying on it (see `verify`).

statuses:
  - taxon_id: puma-concolor
    authority: CESA
    code: T
    scope: ca-southern-central-coast
    population: Southern California / Central Coast DPS
    source: Fish and Game Commission vote, Feb 2026 (docs/research/06-rare-carnivores.md)
    verify: final adoption of findings
  - taxon_id: canis-lupus
    authority: CESA
    code: E
    scope: us-ca
    source: CESA listing 2014
  - taxon_id: canis-lupus
    authority: ESA
    code: E
    scope: us-ca
    source: Federal listing outside the Northern Rockies DPS (status under litigation, 2026)
  - taxon_id: enhydra-lutris
    authority: ESA
    code: T
    scope: us-ca
    population: southern sea otter (E. l. nereis)
